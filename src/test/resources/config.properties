# Default/local environment config.
# Every value here can be overridden by an environment variable (see
# ConfigManager) so real URLs/credentials never need to be committed to
# source control.
#
#   b2b.url   -> B2B_URL
#   admin.url -> ADMIN_URL
#   email     -> TEST_EMAIL
#   password  -> TEST_PASSWORD

b2b.url=http://192.168.61.115:8001/
admin.url=http://192.168.61.115:3005/

browser=chromium
headless=false
slowmo.ms=0
default.timeout.ms=30000
viewport.width=1920
viewport.height=1080

# Do NOT put real credentials here for anything but a personal/local sandbox.
# Prefer TEST_EMAIL / TEST_PASSWORD environment variables or a secret manager.
email=shafayetkabir.technonext@gmail.com
password=Sqa123@1

# Admin portal login (separate account/role from the B2B agent above).
